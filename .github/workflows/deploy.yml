name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build blog (Eleventy)
        run: npm run build

      - name: Check sitemap for redirect-stub pages
        run: node scripts/check-sitemap-redirects.js

      - name: Keep internal files, secrets and backups out of the Pages artifact (limit 1 GB)
        run: |
          rm -rf _image_backups pinterest-photos-cozy-cactus api-worker functions-backup scripts node_modules test-hostaway-api.js all-reviews-compiled.txt
          find . -maxdepth 1 -type f -name '*.md' ! -name PRIVACY_POLICY.md ! -name EULA.md -delete
          rm -rf tracking performance-data workers pinterest-automation content/backlog
          rm -f content/*.md
          find . -maxdepth 1 -type f -name '*.js' ! -name attribution.js ! -name booking-flow.js ! -name booking-config.js ! -name dashboard-script.js ! -name '.eleventy.js' -delete

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
