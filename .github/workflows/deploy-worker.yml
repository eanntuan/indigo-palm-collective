name: Deploy Cloudflare Worker

# Deploys api-worker/ whenever it changes on main (or when run by hand).
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Workers edit permission).
# Worker secrets (Square, Resend, etc.) live in Cloudflare and are not touched here.

on:
  push:
    branches: [main]
    paths: ['api-worker/**']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: api-worker
          command: deploy
