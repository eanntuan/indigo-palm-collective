name: Auto Pinterest Pins

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**.md'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Blog post slug to pin (e.g. palm-springs-vs-scottsdale)'
        required: true
        default: 'palm-springs-vs-scottsdale'

jobs:
  pin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — a push can bundle many commits, and
                          # we diff against github.event.before, which a
                          # shallow fetch may not include

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pinterest-automation/package.json

      - name: Install dependencies
        working-directory: pinterest-automation
        run: npm install

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome
        working-directory: pinterest-automation

      - name: Find new blog posts
        id: new_posts
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEW="${{ github.event.inputs.slug }}"
          else
            # Only pin genuinely NEW posts (git status "A"), never edits to
            # existing ones — otherwise every content fix re-pins live posts.
            # Compare against github.event.before (the pre-push SHA), not
            # HEAD~1, so a multi-commit push is diffed as a whole and not
            # just its last commit.
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            NEW=$(git diff --name-status "$BEFORE" HEAD -- 'content/blog/*.md' \
              | awk '$1 == "A" {print $2}' \
              | xargs -r -I{} basename {} .md | tr '\n' ' ')
          fi
          echo "slugs=$NEW" >> $GITHUB_OUTPUT
          echo "New posts: $NEW"

      - name: Generate and post pins
        if: steps.new_posts.outputs.slugs != ''
        working-directory: pinterest-automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
        run: |
          for slug in ${{ steps.new_posts.outputs.slugs }}; do
            echo "Processing: $slug"
            node run.js "$slug" || echo "Failed for $slug, continuing..."
          done
