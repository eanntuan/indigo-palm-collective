name: Weekly Backlog Publish

on:
  schedule:
    - cron: '0 16 * * 1' # Mondays 16:00 UTC (8am PST / 9am PDT)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Publish oldest due backlog post
        id: pub
        run: |
          node scripts/publish-backlog.js | tee out.txt
          grep -q '^Published ' out.txt && echo "published=1" >> "$GITHUB_OUTPUT" || true
      - name: Build, commit, push, deploy
        if: steps.pub.outputs.published == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A content blog sitemap.xml
          git commit -m "chore: publish weekly backlog post [$(date -u +%Y-%m-%d)]"
          git push
          gh workflow run deploy.yml
