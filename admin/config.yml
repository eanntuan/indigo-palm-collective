backend:
  name: github
  repo: eanntuan/desert-edit-properties
  branch: main
  base_url: https://indigopalm.co/api
  auth_endpoint: auth

media_folder: "content/blog/images"
public_folder: "/blog/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    description: "Write and edit blog posts. New posts go live in ~2 minutes after saving."
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "50-60 characters. Lead with the main keyword." }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, default: "" }
      - { label: "Meta Description", name: "metaDescription", widget: "text", hint: "140-155 characters. Shows in Google results." }
      - label: "Keywords"
        name: "keywords"
        widget: "list"
        hint: "Add 3-5 keywords. Press Enter after each one."
      - { label: "OG Image (hero image filename)", name: "ogImage", widget: "image", hint: "Main image for social sharing and top of post." }
      - label: "Article Section"
        name: "articleSection"
        widget: "select"
        options: ["Travel Guide", "Local Guide", "Property Update", "Tips & Advice", "Events"]
      - label: "Property"
        name: "property"
        widget: "select"
        options:
          - { label: "All Properties", value: "all" }
          - { label: "The Cozy Cactus", value: "cozy-cactus" }
          - { label: "Terra Luz", value: "terra-luz" }
          - { label: "The Sundune (PS Retreat)", value: "ps-retreat" }
          - { label: "The Well", value: "the-well" }
      - { label: "Read Time", name: "readTime", widget: "string", hint: "e.g. 5 min read", default: "5 min read" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "1-2 sentences shown in the blog card on the blog listing page." }
      - { label: "Body", name: "body", widget: "markdown" }


  - name: "properties"
    label: "Property Pages"
    description: "Edit SEO titles, descriptions, and copy for each property. Changes go live in ~2 minutes."
    files:

      - name: "terra-luz"
        label: "Terra Luz (Indio)"
        file: "_content/terra-luz.json"
        fields:
          - { label: "SEO Page Title", name: "seo_title", widget: "string", hint: "Appears in browser tab and Google results. Keep under 60 characters." }
          - { label: "SEO Meta Description", name: "seo_description", widget: "text", hint: "Appears under the title in Google results. Keep under 155 characters." }
          - { label: "Hero Tagline", name: "tagline", widget: "string", hint: "Short line shown on the hero image." }
          - { label: "Description Heading", name: "description_heading", widget: "string" }
          - { label: "Description Paragraph 1", name: "description_p1", widget: "text" }
          - { label: "Description Paragraph 2", name: "description_p2", widget: "text" }
          - { label: "Description Paragraph 3", name: "description_p3", widget: "text" }
          - { label: "Description Paragraph 4", name: "description_p4", widget: "text" }

      - name: "the-sundune"
        label: "The Sundune (Palm Springs)"
        file: "_content/the-sundune.json"
        fields:
          - { label: "SEO Page Title", name: "seo_title", widget: "string", hint: "Keep under 60 characters." }
          - { label: "SEO Meta Description", name: "seo_description", widget: "text", hint: "Keep under 155 characters." }
          - { label: "Hero Tagline", name: "tagline", widget: "string" }
          - { label: "Description Heading", name: "description_heading", widget: "string" }
          - { label: "Description Paragraph 1", name: "description_p1", widget: "text" }
          - { label: "Description Paragraph 2", name: "description_p2", widget: "text" }
          - { label: "Description Paragraph 3", name: "description_p3", widget: "text" }
          - { label: "Description Paragraph 4", name: "description_p4", widget: "text" }

      - name: "cozy-cactus"
        label: "Cozy Cactus (Indio)"
        file: "_content/cozy-cactus.json"
        fields:
          - { label: "SEO Page Title", name: "seo_title", widget: "string", hint: "Keep under 60 characters." }
          - { label: "SEO Meta Description", name: "seo_description", widget: "text", hint: "Keep under 155 characters." }
          - { label: "Hero Tagline", name: "tagline", widget: "string" }
          - { label: "Description Heading", name: "description_heading", widget: "string" }
          - { label: "Description Paragraph 1", name: "description_p1", widget: "text" }
          - { label: "Description Paragraph 2", name: "description_p2", widget: "text" }
          - { label: "Description Paragraph 3", name: "description_p3", widget: "text" }
          - { label: "Description Paragraph 4", name: "description_p4", widget: "text" }

      - name: "the-well"
        label: "The Well (Palm Springs)"
        file: "_content/the-well.json"
        fields:
          - { label: "SEO Page Title", name: "seo_title", widget: "string", hint: "Keep under 60 characters." }
          - { label: "SEO Meta Description", name: "seo_description", widget: "text", hint: "Keep under 155 characters." }
          - { label: "Hero Tagline", name: "tagline", widget: "string" }
          - { label: "Description Heading", name: "description_heading", widget: "string" }
          - { label: "Description Paragraph 1", name: "description_p1", widget: "text" }
          - { label: "Description Paragraph 2", name: "description_p2", widget: "text" }
          - { label: "Description Paragraph 3", name: "description_p3", widget: "text" }
          - { label: "Description Paragraph 4", name: "description_p4", widget: "text" }

  - name: "sundune-guide"
    label: "Sundune Welcome Guide"
    files:
      - name: "sundune-guide"
        label: "Welcome Guide Copy"
        file: "_content/sundune-guide.json"
        fields:
          - label: "Welcome tab"
            name: "welcome"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Host intro paragraphs", name: "intro", widget: "list", field: { label: "Text", name: "text", widget: "text" }, hint: "Four paragraphs in the host card, in order." }
              - { label: "Host signature", name: "signature", widget: "string" }
              - { label: "Pull quote", name: "quote", widget: "text" }
              - { label: "Pull quote attribution", name: "quote_by", widget: "string" }
              - { label: "Host tips", name: "tips", widget: "list", allow_add: false, fields: [{ label: "Label", name: "label", widget: "string" }, { label: "Text", name: "text", widget: "text" }], hint: "Edit text only. Items keep their order, photos, links and addresses. Basic HTML (<strong>, <a href>) is allowed." }
          - label: "Arrival tab"
            name: "arrival"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Highway 111 warning", name: "gps_warning", widget: "text", hint: "Red callout at the top. Keep the <strong> around the traffic light name." }
              - { label: "Entering the condo steps", name: "steps", widget: "list", allow_add: false, fields: [{ label: "Title", name: "title", widget: "string" }, { label: "Text", name: "text", widget: "text" }], hint: "Edit text only. Items keep their order, photos, links and addresses. Basic HTML (<strong>, <a href>) is allowed." }
              - { label: "WiFi note (under the network name)", name: "wifi_note", widget: "text" }
              - { label: "Noise curfew callout", name: "curfew", widget: "text" }
          - label: "House tab"
            name: "house"
            widget: "object"
            collapsed: true
            fields:
              - { label: "House rules", name: "rules", widget: "list", allow_add: false, fields: [{ label: "Title", name: "title", widget: "string" }, { label: "Text", name: "text", widget: "text" }], hint: "Edit text only. Items keep their order, photos, links and addresses. Basic HTML (<strong>, <a href>) is allowed." }
              - { label: "House guide cards", name: "guide", widget: "list", allow_add: false, fields: [{ label: "Title", name: "title", widget: "string" }, { label: "Text", name: "text", widget: "text" }], hint: "Edit text only. Items keep their order, photos, links and addresses. Basic HTML (<strong>, <a href>) is allowed." }
              - { label: "Pool and spa paragraphs", name: "pool", widget: "list", field: { label: "Text", name: "text", widget: "text" }, hint: "Three paragraphs, in order." }
          - label: "Explore tab"
            name: "explore"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Wanderlust Approved intro", name: "intro", widget: "text" }
              - { label: "Places to Eat note", name: "eat_note", widget: "text" }
              - { label: "Places to Eat", name: "eat", widget: "list", allow_add: false, fields: [{ label: "Name", name: "name", widget: "string" }, { label: "Description", name: "desc", widget: "text" }], hint: "Edit text only. Items keep their order, photos, links and addresses. Basic HTML (<strong>, <a href>) is allowed." }
              - { label: "Places to Drink", name: "drink", widget: "list", allow_add: false, fields: [{ label: "Name", name: "name", widget: "string" }, { label: "Description", name: "desc", widget: "text" }], hint: "Edit text only. Items keep their order, photos, links and addresses. Basic HTML (<strong>, <a href>) is allowed." }
              - { label: "Things to Do", name: "todo", widget: "list", allow_add: false, fields: [{ label: "Title", name: "title", widget: "string" }, { label: "Text", name: "text", widget: "text" }], hint: "Edit text only. Items keep their order, photos, links and addresses. Basic HTML (<strong>, <a href>) is allowed." }
              - { label: "Family Activities", name: "kids", widget: "list", allow_add: false, fields: [{ label: "Name", name: "name", widget: "string" }, { label: "Description", name: "desc", widget: "text" }], hint: "Edit text only. Items keep their order, photos, links and addresses. Basic HTML (<strong>, <a href>) is allowed." }
              - { label: "Places to Cool Off", name: "cool", widget: "list", allow_add: false, fields: [{ label: "Name", name: "name", widget: "string" }, { label: "Description", name: "desc", widget: "text" }], hint: "Edit text only. Items keep their order, photos, links and addresses. Basic HTML (<strong>, <a href>) is allowed." }
              - { label: "EV Charging note", name: "ev_note", widget: "text" }
              - { label: "EV Charging options", name: "ev", widget: "list", allow_add: false, fields: [{ label: "Title", name: "title", widget: "string" }, { label: "Text", name: "text", widget: "text" }], hint: "Edit text only. Items keep their order, photos, links and addresses. Basic HTML (<strong>, <a href>) is allowed." }
          - label: "Checkout tab"
            name: "checkout"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Checkout intro callout", name: "intro", widget: "text" }
              - { label: "Checkout checklist", name: "items", widget: "list", field: { label: "Text", name: "text", widget: "text" }, hint: "Four items, in order." }
              - { label: "Review card title", name: "review_title", widget: "string" }
              - { label: "Review card paragraphs", name: "review", widget: "list", field: { label: "Text", name: "text", widget: "text" }, hint: "Three paragraphs, in order." }
              - { label: "Review card signature", name: "review_sig", widget: "string" }
